<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimate Pro Build</title>
</head>
<body style="margin:0; padding:0; background:#f1f5f9; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;">
  <div style="max-width:440px; width:90%; background:#ffffff; border-radius:16px; overflow:hidden; text-align:center; box-shadow:0 10px 30px rgba(15,23,42,0.08);">
    <div style="height:6px; background:linear-gradient(90deg, #2178A3, #34A8E2);"></div>
    <div style="padding:30px 28px 36px;">
      <div id="icon" style="width:64px; height:64px; border-radius:50%; color:#fff; font-size:1.8rem; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;"></div>
      <h1 id="title" style="font-size:1.15rem; color:#0f172a; margin:0 0 10px;"></h1>
      <p id="message" style="font-size:0.92rem; color:#475569; line-height:1.6; margin:0;"></p>
      <div style="margin-top:26px; font-size:0.72rem; color:#94a3b8; border-top:1px solid #e2e8f0; padding-top:16px;">Estimate Pro Build</div>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var status = params.get("status") || "invalid";
      var company = params.get("company") || "";
      var lang = params.get("lang") === "en" ? "en" : "es";
      document.documentElement.setAttribute("lang", lang);

      var STATES = {
        es: {
          accepted: {
            icon: "✓", color: "#16a34a",
            title: "¡Gracias! Aceptaste la estimación" + (company ? " de " + company : ""),
            message: "El contratista recibirá tu confirmación y se pondrá en contacto contigo pronto.",
          },
          declined: {
            icon: "✕", color: "#ef4444",
            title: "Has declinado la estimación" + (company ? " de " + company : ""),
            message: "El contratista ha sido notificado. Gracias por tu tiempo.",
          },
          already_accepted: {
            icon: "✓", color: "#16a34a",
            title: "Ya habías aceptado esta estimación",
            message: "Tu respuesta ya había quedado registrada anteriormente. El contratista puede verla en su panel.",
          },
          already_declined: {
            icon: "✕", color: "#ef4444",
            title: "Ya habías declinado esta estimación",
            message: "Tu respuesta ya había quedado registrada anteriormente. El contratista puede verla en su panel.",
          },
          invalid: {
            icon: "!", color: "#f59e0b",
            title: "Enlace inválido o vencido",
            message: "No encontramos esta estimación. Si necesitas ayuda, contacta directamente al contratista.",
          },
          error: {
            icon: "!", color: "#ef4444",
            title: "Error del servidor",
            message: "Ocurrió un problema al registrar tu respuesta. Intenta de nuevo más tarde o contacta al contratista.",
          },
        },
        en: {
          accepted: {
            icon: "✓", color: "#16a34a",
            title: "Thank you! You accepted the estimate" + (company ? " from " + company : ""),
            message: "The contractor will receive your confirmation and will reach out to you soon.",
          },
          declined: {
            icon: "✕", color: "#ef4444",
            title: "You declined the estimate" + (company ? " from " + company : ""),
            message: "The contractor has been notified. Thank you for your time.",
          },
          already_accepted: {
            icon: "✓", color: "#16a34a",
            title: "You had already accepted this estimate",
            message: "Your response was already recorded earlier. The contractor can see it on their panel.",
          },
          already_declined: {
            icon: "✕", color: "#ef4444",
            title: "You had already declined this estimate",
            message: "Your response was already recorded earlier. The contractor can see it on their panel.",
          },
          invalid: {
            icon: "!", color: "#f59e0b",
            title: "Invalid or expired link",
            message: "We couldn't find this estimate. If you need help, contact the contractor directly.",
          },
          error: {
            icon: "!", color: "#ef4444",
            title: "Server error",
            message: "There was a problem recording your response. Try again later or contact the contractor.",
          },
        },
      };

      var state = STATES[lang][status] || STATES[lang].invalid;
      document.getElementById("icon").style.background = state.color;
      document.getElementById("icon").textContent = state.icon;
      document.getElementById("title").textContent = state.title;
      document.getElementById("message").textContent = state.message;
      document.title = state.title;
    })();
  </script>
</body>
</html>
